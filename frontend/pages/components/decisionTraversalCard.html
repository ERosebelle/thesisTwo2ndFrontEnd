<div
    id="decisionTraversalCard"
    class="decision-traversal-card"
    hidden
>
    <div class="decision-traversal-card-content">

        <button
            type="button"
            id="decisionTraversalClose"
            class="decision-traversal-close"
            aria-label="Close"
        >
            ✕
        </button>

        <div class="decision-traversal-scroll-content">

            <h2 id="decisionTraversalTitle">
                Detailed Decision Tree Traversal
            </h2>

            <div
                id="decisionTraversalContent"
                class="decision-traversal-content"
            >
                <p>
                    This space provides detailed information about the flow of the Decision Tree.
                    Each shape and line contains an explanation of its role in the decision path.
                    <span class="decision-traversal-instruction">
                        Click any shape to view its explanation. Click the selected shape again to close the explanation.
                    </span>
                </p>
            </div>

            <div class="decision-traversal-main">

                <aside
                    id="decisionTraversalLeftInfo"
                    class="decision-traversal-info-slot left"
                ></aside>

                <div
                    id="decisionTraversalTree"
                    class="decision-traversal-tree"
                ></div>

                <aside
                    id="decisionTraversalRightInfo"
                    class="decision-traversal-info-slot right"
                ></aside>

            </div>

        </div>

    </div>
</div>
