<div class="result-summary">

    <div class="summary-card classification-card">

        <div class="card-label">VULNERABILITY</div>

        <div id="VulnerabilityFound" class="classification-value">
            Loading...
        </div>

        <div class="risk-divider"></div>

        <div class="card-label">RISK LEVEL</div>

        <div id="riskLevel" class="risk-value">
            Loading...
        </div>

        <!-- Tested Password Feature -->
        <div class="password-preview-container">
            <div class="card-label password-label">TESTED PASSWORD</div>
            <div class="password-box" id="testedPassword" title="Click to show/hide">******</div>
        </div>

        <div class="security-score">
            <span>Security Score</span>
            <strong id="securityScore">--</strong>
        </div>

    </div>

    <div class="summary-card explanation-card">

        <div class="card-label">SUMMARY RESULTS</div>

        <h2 id="summaryTitle">
            Explanation
        </h2>

        <div id="summaryText" class="summary-text">
            <p>Waiting for password analysis...</p>
        </div>
    </div>
</div>
