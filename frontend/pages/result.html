<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/images/logo.png">
    <title>Password Analysis Result</title>

    <!-- MAIN CSS -->
    <link rel="stylesheet" href="../css/result.css">

    <!-- COMPONENT CSS -->
    <link rel="stylesheet" href="../css/classification.css">
    <link rel="stylesheet" href="../css/decisionTree.css">
    <link rel="stylesheet" href="../css/recommendation.css">
    <link rel="stylesheet" href="../css/featureVector.css">
    <link rel="stylesheet" href="../css/decisionTraversalCard.css">
    <link rel="stylesheet" href="../css/summaryCard.css">

    <!-- COMPONENT JAVASCRIPT (Required first) -->
    <script src="../js/summaryCard.js" defer></script>
    <script src="../js/classification.js" defer></script>
    <script src="../js/decisionTree.js" defer></script>
    <script src="../js/recommendation.js" defer></script>
    <script src="../js/featureVector.js" defer></script>
    <script src="../js/decisionTraversalCard.js" defer></script>

    <!-- PAGE CONTROLLER -->
    <script src="../js/result.js" defer></script>
</head>
<body>

    <div class="result-container">
        
        <!-- HEADER -->
        <header class="page-header">
            <img src="../assets/images/logo.png" alt="System Logo" class="header-logo">
            <div class="header-text">
                <h1>Password Vulnerability and Cracking Method Classification System</h1>
                <p>Password Analysis Result</p>
            </div>
        </header>

        <!-- WORKSPACE -->
        <main class="result-workspace">

            <!-- SIDEBAR AREA -->
            <aside class="sidebar-area">
                <!-- CLASSIFICATION PANEL -->
                <div class="classification-panel">
                    <div id="classificationSection"></div>
                </div>

                <!-- PASSWORD PREVIEW CARD -->
                <div class="password-preview-card">
                    <div class="password-entry">
                        <span class="password-label">Tested Password</span>
                        <div id="testedPassword" class="hidden-password">********</div>
                    </div>
                </div>
            </aside>

            <!-- MAIN ANALYSIS AREA -->
            <section class="analysis-area">
                <!-- TAB NAVIGATION -->
                <nav class="result-menu">
                    <button class="menu-btn active" data-section="decision">Decision Tree Path</button>
                    <button class="menu-btn" data-section="recommendation">Recommendation</button>
                    <button class="menu-btn" data-section="features">Feature Vector</button>
                </nav>

                <!-- PANEL DISPLAY -->
                <div class="result-panel">
                    <div class="bg-shape"></div>
                    <div id="panelBody">
                        <div id="decisionSection" class="result-section"></div>
                        <div id="recommendationSection" class="result-section"></div>
                        <div id="featureSection" class="result-section"></div>
                    </div>
                </div>

                <!-- BOTTOM DOCK: REMINDER & ACTIONS -->
                <footer class="dock-footer">
                    <p class="system-reminder">
                        This assessment raises awareness of potential password vulnerabilities. No password can guarantee complete protection.
                    </p>
                    <div class="button-group">
                        <button id="resetButton" class="reset-btn">RESET</button>
                        <button id="compareButton" class="compare-btn">COMPARE NEW PASSWORD</button>
                    </div>
                </footer>
            </section>

        </main>

    </div>

    <!-- BUTTON INFO TOOLTIP -->
    <div class="button-info" id="buttonInfo">
        <h3 id="buttonInfoTitle">Button Information</h3>
        <p id="buttonInfoText">Hover over a button to see its function.</p>
    </div>

    <!-- OVERLAY COMPONENT ROOTS -->
    <div id="decisionTraversalCardRoot"></div>
    <div id="summaryCardRoot"></div>

</body>
</html>
